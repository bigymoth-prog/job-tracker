<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070910;
    --surface: #0d1117;
    --card: #111318;
    --border: #1a2035;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #10b981;
    --yellow: #f59e0b;
    --orange: #f97316;
    --red: #ef4444;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --text: #e2e8f0;
    --muted: #64748b;
    --dim: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(0,212,255,0.04) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 100%, rgba(124,58,237,0.04) 0%, transparent 60%);
  }

  /* ── HEADER ── */
  .header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(13,17,23,0.9) 0%, transparent 100%);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .header-inner { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 3px; color: #fff; line-height: 1; }
  .brand h1 span { color: var(--accent); }
  .brand p { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 64px;
  }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; line-height: 1; }
  .stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'DM Mono', monospace; margin-top: 2px; }

  /* ── TOOLBAR ── */
  .toolbar {
    padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,17,23,0.7);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 9px; color: var(--dim); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
  .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
  .fb {
    padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .fb:hover { border-color: var(--accent); color: var(--accent); }
  .fb.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .add-btn {
    margin-left: auto;
    padding: 8px 20px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: #000; border: none; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: opacity 0.15s, transform 0.15s;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: 0.88; transform: translateY(-1px); }

  /* ── STORAGE BANNER ── */
  .banner {
    margin: 12px 32px 0;
    padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-family: 'DM Mono', monospace;
    display: flex; align-items: center; gap: 8px;
  }
  .banner.ok  { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); color: #34d399; }
  .banner.err { background: rgba(239,68,68,0.08);  border: 1px solid rgba(239,68,68,0.25);  color: #fca5a5; }
  .banner-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .banner.ok  .banner-dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
  .banner.err .banner-dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

  /* ── BODY ── */
  .body { padding: 20px 32px 40px; }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 9px;
    transition: border-color 0.2s, transform 0.15s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .card.p-high::before   { background: var(--green); }
  .card.p-medium::before { background: var(--yellow); }
  .card.p-stretch::before{ background: var(--orange); }
  .card:hover { border-color: rgba(0,212,255,0.25); transform: translateY(-1px); }

  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .firm-badge {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 1px;
    flex-shrink: 0; border-width: 1px; border-style: solid;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-title { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.35; margin-bottom: 5px; }
  .meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .tag.loc { color: var(--accent); border-color: rgba(0,212,255,0.2); background: rgba(0,212,255,0.05); }
  .tag.high    { color: var(--green);  border-color: rgba(16,185,129,0.25); }
  .tag.stretch { color: var(--orange); border-color: rgba(249,115,22,0.25); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 20px; padding: 3px 10px;
    font-size: 10px; font-family: 'DM Mono', monospace; font-weight: 700; letter-spacing: 1px;
    border-width: 1px; border-style: solid; white-space: nowrap;
  }
  .pill-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

  .job-id { font-size: 10px; color: var(--dim); font-family: 'DM Mono', monospace; }
  .notes-box {
    font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace;
    background: var(--surface); border-radius: 6px; padding: 8px 10px;
    border: 1px solid var(--border); line-height: 1.6;
  }
  .action-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .action-label { font-size: 10px; color: var(--dim); font-family: 'DM Mono', monospace; }
  .status-sel {
    font-size: 10px; background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 4px 7px;
    cursor: pointer; font-family: 'DM Mono', monospace; outline: none;
  }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 12px; padding: 3px 7px; border-radius: 5px;
    font-family: 'DM Mono', monospace; transition: opacity 0.15s;
  }
  .icon-btn:hover { opacity: 0.75; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--dim); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; margin-bottom: 6px; }
  .empty-sub { font-size: 12px; color: #1e293b; }

  /* ── MODAL ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  .modal {
    background: #111318; border: 1px solid #1e2535;
    border-radius: 16px; padding: 28px; width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.2s ease;
  }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: #fff; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; font-size: 13px; font-family: 'DM Mono', monospace;
    color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .save-btn {
    width: 100%; padding: 11px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: #000; border: none; font-size: 14px; font-weight: 700;
    cursor: pointer; margin-top: 6px; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .save-btn:hover { opacity: 0.88; }
  .cancel-btn {
    width: 100%; padding: 10px; border-radius: 9px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-size: 13px;
    cursor: pointer; margin-top: 8px; font-family: 'DM Sans', sans-serif;
  }
  .del-modal { max-width: 340px; text-align: center; }
  .del-icon { font-size: 32px; margin-bottom: 12px; }
  .del-title { font-size: 15px; color: #fff; font-weight: 600; margin-bottom: 6px; }
  .del-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
  .del-btn { background: linear-gradient(135deg,#ef4444,#b91c1c) !important; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 22px; right: 22px;
    padding: 12px 20px; border-radius: 10px; font-size: 12px;
    font-family: 'DM Mono', monospace; z-index: 200;
    animation: fadeIn 0.2s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.ok  { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; }
  .toast.err { background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.4);  color: #fca5a5; }

  @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
  @keyframes slideUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:translateY(0) } }

  /* ── PASSWORD SCREEN ── */
  #lockScreen {
    position: fixed; inset: 0; z-index: 9999;
    background: #070910;
    background-image: radial-gradient(ellipse at 30% 20%, rgba(0,212,255,0.07) 0%, transparent 60%),
                      radial-gradient(ellipse at 70% 80%, rgba(124,58,237,0.07) 0%, transparent 60%);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.3s ease;
  }
  #lockScreen.hidden { display: none; }
  .lock-box {
    background: #111318;
    border: 1px solid #1a2035;
    border-radius: 18px;
    padding: 40px 36px;
    width: 100%; max-width: 380px;
    text-align: center;
    animation: slideUp 0.3s ease;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .lock-icon { font-size: 36px; margin-bottom: 16px; }
  .lock-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px; letter-spacing: 3px; color: #fff; margin-bottom: 6px;
  }
  .lock-title span { color: #00d4ff; }
  .lock-sub {
    font-size: 11px; color: #475569; font-family: 'DM Mono', monospace;
    letter-spacing: 1px; margin-bottom: 28px;
  }
  .lock-input {
    width: 100%; padding: 12px 16px; border-radius: 10px;
    background: #0d1117; border: 1px solid #1a2035;
    color: #e2e8f0; font-size: 15px; font-family: 'DM Mono', monospace;
    outline: none; text-align: center; letter-spacing: 3px;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }
  .lock-input:focus { border-color: #00d4ff; }
  .lock-input.shake {
    animation: shake 0.4s ease;
    border-color: #ef4444;
  }
  .lock-btn {
    width: 100%; padding: 12px; border-radius: 10px;
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    color: #000; border: none; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .lock-btn:hover { opacity: 0.88; }
  .lock-error {
    font-size: 11px; color: #f87171; font-family: 'DM Mono', monospace;
    margin-top: 10px; min-height: 16px;
    animation: fadeIn 0.2s ease;
  }
  .lock-hint {
    font-size: 10px; color: #1e293b; font-family: 'DM Mono', monospace;
    margin-top: 20px;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(5px); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .header { padding: 18px 16px 14px; }
    .brand h1 { font-size: 28px; }
    .toolbar { padding: 10px 16px; }
    .body { padding: 14px 16px 40px; }
    .banner { margin: 10px 16px 0; }
    .modal { padding: 20px; }
    .row2 { grid-template-columns: 1fr; }
    .stats { gap: 7px; }
    .stat-pill { min-width: 54px; padding: 7px 10px; }
    .stat-num { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- PASSWORD LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">JOB <span>TRACKER</span></div>
    <div class="lock-sub">PRIVATE · ENTER PASSWORD TO CONTINUE</div>
    <input class="lock-input" id="lockInput" type="password" placeholder="••••••••" maxlength="32" autocomplete="current-password">
    <button class="lock-btn" id="lockBtn">Unlock</button>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">This page is password protected</div>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <h1>JOB <span>TRACKER</span></h1>
      <p>BIG4 HUNT · FATCA / CRS / AEOI</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="filter-group">
    <span class="filter-label">Status</span>
    <button class="fb on" data-filter-status="all">All</button>
    <button class="fb" data-filter-status="applied">Applied</button>
    <button class="fb" data-filter-status="screening">Screening</button>
    <button class="fb" data-filter-status="interview">Interview</button>
    <button class="fb" data-filter-status="offer">Offer</button>
    <button class="fb" data-filter-status="rejected">Rejected</button>
    <button class="fb" data-filter-status="withdrawn">Withdrawn</button>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">Firm</span>
    <button class="fb on" data-filter-firm="all">All</button>
    <button class="fb" data-filter-firm="EY">EY</button>
    <button class="fb" data-filter-firm="KPMG">KPMG</button>
    <button class="fb" data-filter-firm="Deloitte">Deloitte</button>
    <button class="fb" data-filter-firm="PwC">PwC</button>
    <button class="fb" data-filter-firm="Other">Other</button>
  </div>
  <button class="add-btn" id="addBtn">+ Add Application</button>
</div>

<!-- BANNER -->
<div class="banner ok" id="banner">
  <div class="banner-dot"></div>
  <span id="bannerText">Auto-save active — data stored in this browser</span>
</div>

<!-- BODY -->
<div class="body" id="cardsContainer"></div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="formOverlay" style="display:none">
  <div class="modal">
    <div class="modal-title" id="formTitle">NEW APPLICATION</div>
    <div class="row2">
      <div class="field">
        <label>Company *</label>
        <select id="fCompany">
          <option>EY</option><option>KPMG</option><option>Deloitte</option><option>PwC</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Location</label>
        <select id="fLocation">
          <option>Luxembourg</option><option>Ireland</option><option>UK</option>
          <option>Cyprus</option><option>Switzerland</option><option>UAE</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Role / Position *</label>
      <input id="fRole" type="text" placeholder="e.g. FATCA/CRS Senior Manager">
    </div>
    <div class="row2">
      <div class="field">
        <label>Job ID / Reference</label>
        <input id="fJobId" type="text" placeholder="e.g. 1680312">
      </div>
      <div class="field">
        <label>Date Applied</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Status</label>
        <select id="fStatus">
          <option value="applied">Applied</option>
          <option value="screening">Screening</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
          <option value="withdrawn">Withdrawn</option>
        </select>
      </div>
      <div class="field">
        <label>Priority</label>
        <select id="fPriority">
          <option value="high">⭐ High</option>
          <option value="medium">Medium</option>
          <option value="stretch">🔥 Stretch</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Recruiter name, next steps, deadline…"></textarea>
    </div>
    <button class="save-btn" id="saveBtn">Add Application</button>
    <button class="cancel-btn" id="cancelBtn">Cancel</button>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="overlay" id="delOverlay" style="display:none">
  <div class="modal del-modal">
    <div class="del-icon">🗑️</div>
    <div class="del-title">Remove this application?</div>
    <div class="del-sub">This cannot be undone.</div>
    <button class="save-btn del-btn" id="confirmDelBtn">Yes, Remove</button>
    <button class="cancel-btn" id="cancelDelBtn">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast ok" id="toast" style="display:none"></div>

<script>
// ── PASSWORD PROTECTION ──────────────────────────────────────────────────────
// Change this to your own password:
const APP_PASSWORD = 'BigFour2026';
const SESSION_KEY  = 'jt_auth_v1';

(function() {
  const lock    = document.getElementById('lockScreen');
  const input   = document.getElementById('lockInput');
  const btn     = document.getElementById('lockBtn');
  const errMsg  = document.getElementById('lockError');

  // Already authenticated this session?
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    lock.classList.add('hidden');
    return;
  }

  function tryUnlock() {
    if (input.value === APP_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, '1');
      lock.style.animation = 'fadeIn 0.2s ease reverse';
      setTimeout(() => lock.classList.add('hidden'), 180);
    } else {
      errMsg.textContent = 'Incorrect password. Please try again.';
      input.classList.add('shake');
      input.value = '';
      setTimeout(() => { input.classList.remove('shake'); errMsg.textContent = ''; }, 1500);
    }
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  input.focus();
})();
// ── CONFIG ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'job_tracker_v1';

const STATUS = {
  applied:   { label:'Applied',   color:'#60a5fa', bg:'rgba(96,165,250,0.12)'   },
  screening: { label:'Screening', color:'#a78bfa', bg:'rgba(167,139,250,0.12)'  },
  interview: { label:'Interview', color:'#fbbf24', bg:'rgba(251,191,36,0.12)'   },
  offer:     { label:'Offer',     color:'#34d399', bg:'rgba(52,211,153,0.12)'   },
  rejected:  { label:'Rejected',  color:'#f87171', bg:'rgba(248,113,113,0.12)'  },
  withdrawn: { label:'Withdrawn', color:'#6b7280', bg:'rgba(107,114,128,0.12)'  },
};

const FIRM_COLORS = {
  EY:       ['#1a1a2e','#ffd700'],
  KPMG:     ['#001f5b','#00a0e4'],
  Deloitte: ['#003366','#86bc25'],
  PwC:      ['#2a0050','#e86b32'],
  Other:    ['#1a1a1a','#888888'],
};

const SEED = [
  { id:'seed_1', jobId:'1680312', company:'EY', location:'Ireland',
    role:'FS Tax – Automatic Exchange of Information – Manager/Senior Manager',
    status:'applied', priority:'high',
    dateApplied: new Date().toISOString().slice(0,10), notes:'' },
];

// ── STATE ────────────────────────────────────────────────────────────────────
let apps        = [];
let filterStatus = 'all';
let filterFirm   = 'all';
let editingId    = null;
let deletingId   = null;
let storageOk    = false;

// ── STORAGE ──────────────────────────────────────────────────────────────────
function testStorage() {
  try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); return true; }
  catch(e) { return false; }
}
function loadApps() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (Array.isArray(d) && d.length) return d; }
  } catch(e) {}
  return JSON.parse(JSON.stringify(SEED));
}
function saveApps() {
  if (!storageOk) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(apps)); } catch(e) {}
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderStats() {
  const total     = apps.length;
  const applied   = apps.filter(a=>a.status==='applied').length;
  const interview = apps.filter(a=>a.status==='interview').length;
  const offer     = apps.filter(a=>a.status==='offer').length;
  const rejected  = apps.filter(a=>a.status==='rejected').length;
  const items = [['Total',total,'#00d4ff'],['Applied',applied,'#60a5fa'],
                 ['Interview',interview,'#fbbf24'],['Offer',offer,'#34d399'],['Rejected',rejected,'#f87171']];
  document.getElementById('stats').innerHTML = items.map(([l,n,c])=>`
    <div class="stat-pill">
      <div class="stat-num" style="color:${c}">${n}</div>
      <div class="stat-lbl">${l}</div>
    </div>`).join('');
}

function firmBadge(firm) {
  const [bg,fg] = FIRM_COLORS[firm]||FIRM_COLORS.Other;
  const abbr = {Deloitte:'DLT',Other:'OTH'}[firm]||firm;
  return `<div class="firm-badge" style="background:${bg};color:${fg};border-color:${fg}55">${abbr}</div>`;
}

function statusPill(status) {
  const s = STATUS[status]||STATUS.applied;
  return `<span class="pill" style="background:${s.bg};border-color:${s.color}44;color:${s.color}">
    <span class="pill-dot" style="background:${s.color};box-shadow:0 0 5px ${s.color}"></span>
    ${s.label.toUpperCase()}
  </span>`;
}

function renderCards() {
  const visible = apps.filter(a=>
    (filterStatus==='all'||a.status===filterStatus) &&
    (filterFirm==='all'||a.company===filterFirm)
  );
  const container = document.getElementById('cardsContainer');
  if (visible.length===0) {
    container.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-title">${apps.length===0?'No applications yet':'No matches for this filter'}</div>
      <div class="empty-sub">${apps.length===0?"Click '+ Add Application' to get started":'Try changing your filters'}</div>
    </div>`;
    return;
  }
  container.innerHTML = visible.map(app=>`
    <div class="card p-${app.priority}" id="card-${app.id}">
      <div class="card-top">
        ${firmBadge(app.company)}
        <div class="card-info">
          <div class="card-title">${esc(app.role)}</div>
          <div class="meta-row">
            ${statusPill(app.status)}
            ${app.location?`<span class="tag loc">📍 ${esc(app.location)}</span>`:''}
            <span class="tag">${app.dateApplied||''}</span>
            ${app.priority==='high'?'<span class="tag high">⭐ HIGH</span>':''}
            ${app.priority==='stretch'?'<span class="tag stretch">🔥 STRETCH</span>':''}
          </div>
        </div>
      </div>
      ${app.jobId?`<div class="job-id">JOB ID: ${esc(app.jobId)}</div>`:''}
      ${app.notes?`<div class="notes-box">${esc(app.notes)}</div>`:''}
      <div class="action-row">
        <span class="action-label">Status:</span>
        <select class="status-sel" onchange="quickStatus('${app.id}',this.value)">
          ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${k===app.status?' selected':''}>${v.label}</option>`).join('')}
        </select>
        <button class="icon-btn" style="color:#60a5fa" onclick="openEdit('${app.id}')">✎ Edit</button>
        <button class="icon-btn" style="color:#f87171" onclick="openDelete('${app.id}')">✕ Remove</button>
      </div>
    </div>`).join('');
}

function render() { renderStats(); renderCards(); }

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function quickStatus(id, status) {
  apps = apps.map(a=>a.id===id?{...a,status}:a);
  saveApps(); render();
  notify(`Status → ${STATUS[status].label}`);
}

function openAdd() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'NEW APPLICATION';
  document.getElementById('fCompany').value  = 'EY';
  document.getElementById('fLocation').value = 'Ireland';
  document.getElementById('fRole').value     = '';
  document.getElementById('fJobId').value    = '';
  document.getElementById('fDate').value     = new Date().toISOString().slice(0,10);
  document.getElementById('fStatus').value   = 'applied';
  document.getElementById('fPriority').value = 'high';
  document.getElementById('fNotes').value    = '';
  document.getElementById('saveBtn').textContent = 'Add Application';
  document.getElementById('formOverlay').style.display = 'flex';
}

function openEdit(id) {
  const app = apps.find(a=>a.id===id); if (!app) return;
  editingId = id;
  document.getElementById('formTitle').textContent   = 'EDIT APPLICATION';
  document.getElementById('fCompany').value  = app.company;
  document.getElementById('fLocation').value = app.location;
  document.getElementById('fRole').value     = app.role;
  document.getElementById('fJobId').value    = app.jobId||'';
  document.getElementById('fDate').value     = app.dateApplied||'';
  document.getElementById('fStatus').value   = app.status;
  document.getElementById('fPriority').value = app.priority;
  document.getElementById('fNotes').value    = app.notes||'';
  document.getElementById('saveBtn').textContent = 'Save Changes';
  document.getElementById('formOverlay').style.display = 'flex';
}

function closeForm() { document.getElementById('formOverlay').style.display='none'; editingId=null; }

function submitForm() {
  const role = document.getElementById('fRole').value.trim();
  const company = document.getElementById('fCompany').value;
  if (!role) return notify('Role is required','err');
  const entry = {
    id: editingId||`app_${Date.now()}`,
    company, role,
    location: document.getElementById('fLocation').value,
    jobId:    document.getElementById('fJobId').value.trim(),
    dateApplied: document.getElementById('fDate').value,
    status:   document.getElementById('fStatus').value,
    priority: document.getElementById('fPriority').value,
    notes:    document.getElementById('fNotes').value.trim(),
  };
  if (editingId) {
    apps = apps.map(a=>a.id===editingId?entry:a);
    notify('Application updated ✓');
  } else {
    apps = [entry, ...apps];
    notify('Application added ✓');
  }
  saveApps(); render(); closeForm();
}

function openDelete(id) {
  deletingId = id;
  document.getElementById('delOverlay').style.display = 'flex';
}
function closeDelete() { document.getElementById('delOverlay').style.display='none'; deletingId=null; }
function confirmDelete() {
  apps = apps.filter(a=>a.id!==deletingId);
  saveApps(); render(); closeDelete();
  notify('Application removed');
}

// ── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function notify(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type}`;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 3000);
}

// ── FILTERS ──────────────────────────────────────────────────────────────────
document.querySelectorAll('[data-filter-status]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterStatus = btn.dataset.filterStatus;
    document.querySelectorAll('[data-filter-status]').forEach(b=>b.classList.toggle('on', b===btn));
    render();
  });
});
document.querySelectorAll('[data-filter-firm]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterFirm = btn.dataset.filterFirm;
    document.querySelectorAll('[data-filter-firm]').forEach(b=>b.classList.toggle('on', b===btn));
    render();
  });
});

// ── EVENTS ───────────────────────────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', openAdd);
document.getElementById('saveBtn').addEventListener('click', submitForm);
document.getElementById('cancelBtn').addEventListener('click', closeForm);
document.getElementById('confirmDelBtn').addEventListener('click', confirmDelete);
document.getElementById('cancelDelBtn').addEventListener('click', closeDelete);
document.getElementById('formOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeForm(); });
document.getElementById('delOverlay').addEventListener('click',  e=>{ if(e.target===e.currentTarget) closeDelete(); });

// ── INIT ─────────────────────────────────────────────────────────────────────
storageOk = testStorage();
if (!storageOk) {
  const b = document.getElementById('banner');
  b.className = 'banner err';
  document.getElementById('bannerText').textContent = '⚠ Storage unavailable — try a different browser';
}
apps = loadApps();
render();
</script>
</body>
</html>
